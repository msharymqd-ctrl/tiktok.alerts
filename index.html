<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskflow — To-do list</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><section class="app-card"><header class="app-header"><div><p class="eyebrow">PERSONAL PRODUCTIVITY</p><h1>My tasks</h1><p class="subtitle">Keep your day focused and organized.</p></div><div class="progress-ring" id="progressRing"><span id="progressPercent">0%</span></div></header><form class="add-form" id="addForm"><label class="sr-only" for="taskInput">Add a task</label><input id="taskInput" maxlength="120" autocomplete="off" placeholder="What needs to be done?"><button class="add-button" type="submit">+</button></form><div class="toolbar"><div class="filters"><button class="filter active" type="button" data-filter="all">All <span id="allCount">0</span></button><button class="filter" type="button" data-filter="active">Active <span id="activeCount">0</span></button><button class="filter" type="button" data-filter="completed">Completed <span id="completedCount">0</span></button></div><button class="clear-button" id="clearCompleted" type="button">Clear completed</button></div><div id="taskList" class="task-list"></div><div id="emptyState" class="empty-state"><div class="empty-icon">✓</div><h2 id="emptyTitle">All clear!</h2><p id="emptyText">Add a task above to get started.</p></div><footer><span id="remainingText">0 tasks remaining</span><span>Saved automatically</span></footer></section></main><script src="app.js"></script></body></html>
